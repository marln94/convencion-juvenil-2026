# Infraestructural local para desarrollo: DynamoDB Local y MinIO (S3 compatible).
# Uso: docker compose -f docker-compose.local.yml up -d   y luego   pnpm setup:local
services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: convencion-dynamodb-local
    user: root
    ports:
      - "8000:8000"
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/home/dynamodblocal/data"]
    volumes:
      - dynamodb-local-data:/home/dynamodblocal/data

  minio:
    image: quay.io/minio/minio:latest
    container_name: convencion-minio
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # La edición comunitaria de MinIO NO soporta PutBucketCors (501).
      # Habilitamos CORS global de la API S3 para permitir el PUT del navegador.
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    volumes:
      - minio-data:/data

volumes:
  dynamodb-local-data:
  minio-data: